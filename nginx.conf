server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Seite immer frisch, damit neue Ausgaben ankommen
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # CSS und JS tragen keinen Hash im Namen: kurz cachen, dann per ETag prüfen
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Schriften und Bilder ändern sich selten
    location ~* \.(woff2|jpg|png|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
