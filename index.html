<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Hast du Eier?</title>
    <meta name="description" content="Eier, wir brauchen Eier. Eine Frage, eine Antwort: Hast du Eier?">
    <meta name="theme-color" content="#ffffff">

    <meta property="og:title" content="Hast du Eier?">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.hastdueier.de/">
    <meta property="og:image" content="https://www.hastdueier.de/assets/img/og-schlicht.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:description" content="Eier, wir brauchen Eier. Eine Frage, eine Antwort.">
    <meta property="og:locale" content="de_DE">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preload" href="assets/fonts/hanken-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://media.giphy.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="stylesheet" href="assets/css/schlicht.css">
    <script type="module" src="assets/js/schlicht.js"></script>
</head>
<body>
    <div class="page">
        <header class="kopf">
            <h1 class="frage">Hast du Eier?</h1>
            <p class="notiz">
                <span class="notiz__kumpel" hidden>Antwort von deinem Kumpel</span>
                <span class="notiz__tag">Eier, wir brauchen Eier.</span>
            </p>
        </header>

        <main class="antwort" data-stage="waiting" aria-labelledby="urteil" aria-live="polite">
            <h2 class="urteil" id="urteil"></h2>

            <div class="text">
                <p class="dek"></p>
                <p class="lede" hidden></p>
            </div>

            <figure class="clip">
                <div class="clip__media"></div>
                <figcaption class="clip__caption"></figcaption>
            </figure>

            <div class="actions">
                <button class="btn btn--primary" type="button" data-action="share">
                    <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7"/></svg>
                    <span>Teilen</span>
                </button>
                <button class="btn btn--secondary" type="button" data-action="again">
                    <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 4v5h-5M20 12a8 8 0 0 1-14 5.3M4 20v-5h5"/></svg>
                    <span class="btn__label">Nochmal</span>
                </button>
                <p class="toast" role="status" aria-live="polite"></p>
            </div>

            <noscript>
                <p class="noscript">Ohne JavaScript keine Antwort. Schalt es an.</p>
            </noscript>
        </main>

        <footer class="fuss">hastdueier.de</footer>
    </div>
</body>
</html>
