<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Hast du Eier?</title>
    <meta name="description" content="Eier, wir brauchen Eier. Zehn Meter, ein Brett, eine Frage: Hast du Eier? Spring oder kletter runter.">
    <meta name="theme-color" content="#0a5fa8">

    <meta property="og:title" content="Hast du Eier?">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.hastdueier.de/">
    <meta property="og:image" content="https://www.hastdueier.de/assets/img/og-zehner.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:description" content="Eier, wir brauchen Eier. Zehn Meter, ein Brett, eine Frage.">
    <meta property="og:locale" content="de_DE">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preload" href="assets/fonts/barlowcondensed-black.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/barlow-bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://media.giphy.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="stylesheet" href="assets/css/zehner.css">
    <script type="module" src="assets/js/zehner.js"></script>
</head>
<body>
    <div class="bad">
        <header class="turm">
            <div class="turm__kopf">
                <p class="turm__hoehe" aria-label="10 Meter">10<span aria-hidden="true">m</span></p>
                <p class="turm__meta">
                    <span>Sprungturm</span>
                    <span>Versuch <span class="turm__versuch">1</span></span>
                </p>
            </div>

            <p class="kumpel" hidden>Dein Kumpel stand schon oben.</p>

            <h1 class="schild">Hast du <em>Eier?</em></h1>

            <div class="leiter" aria-hidden="true"></div>
        </header>

        <main class="becken" data-stage="waiting">
            <section class="sprung" aria-labelledby="urteil" aria-live="polite">
                <div class="wasser">
                    <p class="zaehler" aria-hidden="true"></p>
                    <h2 class="urteil" id="urteil"></h2>
                    <div class="platsch" aria-hidden="true"><i></i><i></i><i></i></div>
                    <div class="piktogramm" aria-hidden="true">
                        <svg class="piktogramm--ja" viewBox="0 0 100 100"><circle cx="50" cy="53" r="8"/><path d="M50 63v20M43 70l7 13 7-13M52 44l6-22M58 22l-6-16M58 22l9-14M18 92q8-6 16 0t16 0 16 0 16 0"/></svg>
                        <svg class="piktogramm--nein" viewBox="0 0 100 100"><path d="M22 8v86M46 8v86M22 22h24M22 40h24M22 58h24M22 76h24"/><circle cx="68" cy="26" r="8"/><path d="M67 36l-2 24M66 44l-20-4M65 60l-19 14M65 60l6 20M86 50v34M79 76l7 9 7-9"/></svg>
                    </div>
                </div>

                <div class="rand">
                    <p class="dek"></p>
                    <p class="lede" hidden></p>

                    <figure class="clip">
                        <div class="clip__media"></div>
                        <figcaption class="clip__caption"></figcaption>
                    </figure>

                    <div class="actions">
                        <button class="btn btn--primary" type="button" data-action="share">
                            <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7"/></svg>
                            <span>Teilen</span>
                        </button>
                        <button class="btn btn--secondary" type="button" data-action="again">
                            <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 4v5h-5M20 12a8 8 0 0 1-14 5.3M4 20v-5h5"/></svg>
                            <span class="btn__label">Nochmal</span>
                        </button>
                    </div>
                    <p class="toast" role="status" aria-live="polite"></p>
                </div>
            </section>

            <noscript>
                <p class="noscript">Ohne JavaScript bleibt das Becken leer. Schalt es an, dann wird gesprungen.</p>
            </noscript>

            <footer class="regeln">Springen auf eigene Gefahr.</footer>
        </main>
    </div>

    <svg class="filter" aria-hidden="true" focusable="false">
        <filter id="unterwasser" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency=".006 .022" numOctaves="1" seed="4"/>
            <feDisplacementMap in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
    </svg>
</body>
</html>
